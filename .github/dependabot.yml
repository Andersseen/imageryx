version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # The Angular compiler pins a narrow TypeScript range (Angular 22
      # requires >=6.0.0 <6.1.0), so typescript and the TS-aware lint
      # packages must move in the same PR or the build fails on arrival.
      angular:
        patterns:
          - "@angular/*"
          - "@analogjs/*"
          - "angular-eslint"
          - "typescript"
          - "typescript-eslint"
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
    open-pull-requests-limit: 10

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
