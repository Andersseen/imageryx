name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

# Least-privilege default — only the deploy job (below) needs anything beyond read access, and
# declares its own narrower `permissions` block that overrides this one for that job only.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify workspace structure
        run: pnpm verify:structure

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Backend integration test (real D1 + R2, no mocks)
        run: pnpm test:integration

      # Enforces the per-package thresholds in each vitest.config.ts (measured from the actual
      # repository state, not arbitrary — see each config's comment). Not yet `continue-on-error`:
      # thresholds were deliberately set at/below what's already passing, so a real regression
      # should fail the build, not just get noted.
      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  e2e:
    name: Dashboard end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm e2e:install

      # Boots a real api-worker against a real (Miniflare-backed) D1 and R2, plus the real
      # dashboard, and drives the browser through upload -> processing -> library. Needs no
      # Cloudflare credentials, so it runs on every pull request rather than only on main.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report
          retention-days: 7

  a11y:
    name: Accessibility smoke (axe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm e2e:install

      # Same real api-worker + dashboard boot as the e2e job, scanning 5 representative pages with
      # axe-core (wcag2a/wcag2aa, serious+critical impact only) — a smoke check, not a full audit.
      - name: Accessibility smoke tests
        run: pnpm test:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: apps/dashboard/playwright-report
          retention-days: 7

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: [check, e2e, a11y]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ matrix.app }} (production)
      url: ${{ matrix.url }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            package: "@imageryx/web"
            url: https://imageryx-web.pages.dev
          - app: dashboard
            package: "@imageryx/dashboard"
            url: https://imageryx-dashboard.pages.dev
          - app: api-worker
            package: "@imageryx/api-worker"
            url: https://imageryx-api-worker.workers.dev
          - app: delivery-worker
            package: "@imageryx/delivery-worker"
            url: https://imageryx-delivery-worker.workers.dev
          - app: processing-worker
            package: "@imageryx/processing-worker"
            url: https://imageryx-processing-worker.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        if: matrix.app == 'api-worker'
        run: pnpm --filter @imageryx/api-worker run db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy
        run: pnpm turbo run deploy --filter=${{ matrix.package }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  retire-skipped-deployments:
    name: Retire skipped deployments
    needs: [check, e2e, a11y]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_DEPLOY_ENABLED != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Mark previous Cloudflare deployments inactive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          environments=(
            "web (production)"
            "dashboard (production)"
            "api-worker (production)"
            "delivery-worker (production)"
            "processing-worker (production)"
          )

          for environment in "${environments[@]}"; do
            deployment_ids="$(
              gh api "/repos/${GITHUB_REPOSITORY}/deployments" \
                -f environment="$environment" \
                -F per_page=100 \
                --jq '.[].id' || true
            )"

            if [ -z "$deployment_ids" ]; then
              echo "::notice::No deployments found for $environment."
              continue
            fi

            while IFS= read -r deployment_id; do
              [ -n "$deployment_id" ] || continue
              if ! gh api --method POST "/repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses" \
                -f state=inactive \
                -f description="Automatic Cloudflare deploys are disabled for this repository." \
                -F auto_inactive=false >/dev/null; then
                echo "::warning::Could not mark deployment $deployment_id inactive for $environment."
              fi
            done <<< "$deployment_ids"

            echo "::notice::Marked previous deployments inactive for $environment."
          done
