name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify workspace structure
        run: pnpm verify:structure

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Backend integration test (real D1 + R2, no mocks)
        run: pnpm test:integration

      - name: Build
        run: pnpm build

  e2e:
    name: Dashboard end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm e2e:install

      # Boots a real api-worker against a real (Miniflare-backed) D1 and R2, plus the real
      # dashboard, and drives the browser through upload -> processing -> library. Needs no
      # Cloudflare credentials, so it runs on every pull request rather than only on main.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report
          retention-days: 7

  deploy:
    name: Deploy ${{ matrix.app }}
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ matrix.app }} (production)
      url: ${{ matrix.url }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            package: "@imageryx/web"
            url: https://imageryx-web.pages.dev
          - app: dashboard
            package: "@imageryx/dashboard"
            url: https://imageryx-dashboard.pages.dev
          - app: api-worker
            package: "@imageryx/api-worker"
            url: https://imageryx-api-worker.workers.dev
          - app: delivery-worker
            package: "@imageryx/delivery-worker"
            url: https://imageryx-delivery-worker.workers.dev
          - app: processing-worker
            package: "@imageryx/processing-worker"
            url: https://imageryx-processing-worker.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Apply D1 migrations
        if: matrix.app == 'api-worker'
        run: pnpm --filter @imageryx/api-worker run db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build and deploy
        run: pnpm turbo run deploy --filter=${{ matrix.package }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
