name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

# Least-privilege default — only the Pages deploy jobs need anything beyond read access, and
# declare their own narrower `permissions` block that overrides this one for those jobs only.
permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Verify workspace structure
        run: pnpm verify:structure

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Backend integration test (real D1 + R2, no mocks)
        run: pnpm test:integration

      # Enforces the per-package thresholds in each vitest.config.ts (measured from the actual
      # repository state, not arbitrary — see each config's comment). Not yet `continue-on-error`:
      # thresholds were deliberately set at/below what's already passing, so a real regression
      # should fail the build, not just get noted.
      - name: Coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  e2e:
    name: Dashboard end-to-end
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm e2e:install

      # Boots a real api-worker against a real (Miniflare-backed) D1 and R2, plus the real
      # dashboard, and drives the browser through upload -> processing -> library. Needs no
      # Cloudflare credentials, so it runs on every pull request rather than only on main.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/dashboard/playwright-report
          retention-days: 7

  a11y:
    name: Accessibility smoke (axe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm e2e:install

      # Same real api-worker + dashboard boot as the e2e job, scanning 5 representative pages with
      # axe-core (wcag2a/wcag2aa, serious+critical impact only) — a smoke check, not a full audit.
      - name: Accessibility smoke tests
        run: pnpm test:a11y

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: apps/dashboard/playwright-report
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy — runs only for a push to main, which is what a PR merge produces.
  #
  # Ordering is deliberate: Workers first, then the Pages apps that talk to them.
  # A dashboard build that goes live pointing at an api-worker whose deploy just
  # failed is worse than not shipping the frontend at all, so `deploy-pages`
  # gates on `deploy-workers` rather than running beside it.
  #
  # Every job below declares an `environment:`, which is what makes GitHub record
  # a Deployment (and show it on the repo sidebar with a real state and URL)
  # instead of the job passing silently. The five environment names here are
  # exactly the five that already exist on the repository.
  # ---------------------------------------------------------------------------
  deploy-workers:
    name: Deploy ${{ matrix.app }}
    needs: [check, e2e, a11y]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ matrix.app }} (production)
      url: ${{ matrix.url }}
    # Serialize per app without cancelling: two merges landing close together must
    # not race each other onto the same Worker. `cancel-in-progress: false` because
    # a half-finished deploy is not something to abort partway.
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: delivery-worker
            package: "@imageryx/delivery-worker"
            url: https://imageryx-delivery-worker.andriipap01.workers.dev
          - app: processing-worker
            package: "@imageryx/processing-worker"
            url: https://imageryx-processing-worker.andriipap01.workers.dev
          - app: api-worker
            package: "@imageryx/api-worker"
            url: https://imageryx-api-worker.andriipap01.workers.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Deliberately fails rather than skipping. Earlier revisions of this workflow
      # treated absent Cloudflare credentials as "nothing to do" and went green, which
      # is precisely why the repo sat undeployed while CI looked healthy.
      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — set them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # api-worker owns the schema, so it is the single place migrations are applied.
      # This runs before its own deploy so the code that goes live never sees a table
      # that does not exist yet.
      - name: Apply D1 migrations (production)
        if: matrix.app == 'api-worker'
        run: pnpm --filter @imageryx/api-worker run db:migrate:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.package }} run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-pages:
    name: Deploy ${{ matrix.app }}
    needs: [deploy-workers]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ matrix.app }} (production)
      url: ${{ matrix.url }}
    concurrency:
      group: deploy-${{ matrix.app }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            package: "@imageryx/web"
            url: https://imageryx-web.pages.dev
          - app: dashboard
            package: "@imageryx/dashboard"
            url: https://imageryx-dashboard.pages.dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — set them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Vite inlines VITE_* at build time, so these must be present here rather than
      # configured on the Pages project afterwards. Without them the bundle keeps
      # dashboard-env.ts's localhost defaults — which is what shipped previously and
      # is why the deployed dashboard could never reach a real backend.
      #
      # The dashboard's own browser traffic goes through its server-side /proxy route,
      # not VITE_API_URL; these values feed the copy-pasteable integration snippets the
      # dashboard renders, so they still have to name the real public endpoints.
      - name: Build ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.package }} run build
        env:
          VITE_APP_ENV: production
          VITE_API_URL: https://imageryx-api-worker.andriipap01.workers.dev
          VITE_DELIVERY_URL: https://imageryx-delivery-worker.andriipap01.workers.dev
          VITE_PROCESSING_URL: https://imageryx-processing-worker.andriipap01.workers.dev

      - name: Deploy ${{ matrix.app }}
        run: pnpm --filter ${{ matrix.package }} run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
