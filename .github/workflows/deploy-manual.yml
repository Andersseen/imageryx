name: Manual Deploy

# Separate from ci.yml's automatic push-to-main deploy — lets a single app be redeployed on
# demand (e.g. after rotating a secret, or re-running a flaky deploy step) without requiring a new
# commit to main. Does not run `check`/`e2e`/`a11y` itself: only use this against a commit that
# already passed CI, or accept the risk of deploying one that hasn't. This is intentionally scoped
# to the two Cloudflare Pages apps that GitHub should show as production deployments.
on:
  workflow_dispatch:
    inputs:
      app:
        description: "Which app to deploy"
        required: true
        type: choice
        options:
          - web
          - dashboard

jobs:
  deploy:
    name: Deploy ${{ inputs.app }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: ${{ inputs.app }} (production)
      url: ${{ inputs.app == 'web' && 'https://imageryx-web.pages.dev' || 'https://imageryx-dashboard.pages.dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        run: pnpm --filter @imageryx/${{ inputs.app }} run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
