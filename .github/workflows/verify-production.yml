name: Verify Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Production Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production API key
        env:
          IMAGERYX_PRODUCTION_API_KEY: ${{ secrets.IMAGERYX_PRODUCTION_API_KEY }}
        run: |
          if [ -z "$IMAGERYX_PRODUCTION_API_KEY" ]; then
            echo "::error::Missing IMAGERYX_PRODUCTION_API_KEY repository secret."
            echo "::error::Create a database-backed API key from the dashboard /api page,"
            echo "::error::then add it under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Run production verification
        run: pnpm verify:production
        env:
          IMAGERYX_PRODUCTION_API_KEY: ${{ secrets.IMAGERYX_PRODUCTION_API_KEY }}
